# Only install package versions that have been published for at least 1 day.
# This reduces the risk of pulling a freshly published, potentially
# compromised release. `ncu` also reads this value when running without
# an explicit --cooldown flag.
minimumReleaseAge: 1440

# The committed pnpm-lock.yaml is trusted (it is generated locally under the
# same minimumReleaseAge policy). Without this, `pnpm install --frozen-lockfile`
# in CI re-verifies every lockfile entry and fails whenever a freshly added
# transitive dependency is still within the minimumReleaseAge window.
trustLockfile: true

# Dependencies explicitly reviewed and allowed to run install/build scripts.
# vue-demi (pulled in by @vueuse/core) runs a postinstall to select the
# correct Vue 2/3 entry point.
allowBuilds:
  vue-demi: true
