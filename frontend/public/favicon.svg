<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hodler Scanner">
  <defs>
    <linearGradient id="hs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a26"/>
      <stop offset="1" stop-color="#0a0f16"/>
    </linearGradient>
    <linearGradient id="hs-acc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect width="64" height="64" rx="15" fill="url(#hs-bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- rising trend line -->
  <polyline points="12,46 26,34 36,40 51,19"
            fill="none" stroke="url(#hs-acc)" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- scan node at the start of the line -->
  <circle cx="12" cy="46" r="2.8" fill="#10b981"/>

  <!-- diamond (hodl) at the peak -->
  <path d="M51 11 L58 19 L51 27 L44 19 Z" fill="url(#hs-acc)"/>
  <path d="M51 15 L54.5 19 L51 23 L47.5 19 Z" fill="#0a0f16" fill-opacity="0.35"/>
</svg>
