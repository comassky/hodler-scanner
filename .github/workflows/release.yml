name: Release

# Manual release: bumps frontend/package.json, tags X.Y.Z, builds & pushes the
# Docker image (X.Y.Z + latest), publishes a GitHub release, then reopens the
# next development version (X.Y.(Z+1)-SNAPSHOT) on the branch.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump level'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          raw=$(npm version "${{ inputs.bump }}" --no-git-tag-version --prefix frontend)
          version="${raw#v}"                           # v1.1.0 -> 1.1.0
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git add frontend/package.json frontend/package-lock.json
          git commit -m "chore(release): $VERSION"
          git tag "$VERSION"
          git push origin HEAD "$VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.bump.outputs.version }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (X.Y.Z + latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          name: ${{ steps.bump.outputs.version }}
          generate_release_notes: true

      - name: Open next development version (-SNAPSHOT)
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          IFS=. read -r major minor patch <<< "$VERSION"
          next="$major.$minor.$((patch + 1))-SNAPSHOT" # 1.1.1-SNAPSHOT
          npm version "$next" --no-git-tag-version --allow-same-version --prefix frontend
          git add frontend/package.json frontend/package-lock.json
          git commit -m "chore: open next development version $next"
          git push origin HEAD
