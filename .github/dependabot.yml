version: 2
updates:
  # ── Python API dependencies (requirements.txt at repo root) ──
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      python:            # everything (major included) in a single PR
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # ── Frontend dependencies (Vue / Vite / Tailwind) ──
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      frontend:          # everything (major included) in a single PR
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # ── Docker base images (root Dockerfile + frontend/Dockerfile) ──
  - package-ecosystem: docker
    directories:
      - /
      - /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "chore(docker)"

  # ── GitHub Actions used in the workflows ──
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

